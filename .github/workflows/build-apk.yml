name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          UNIVERSAL_APK="app/build/outputs/apk/universal/release/app-universal-release.apk"
          if [ ! -f "$UNIVERSAL_APK" ]; then
            UNIVERSAL_APK=$(find app/build/outputs/apk -name "*-release.apk" | head -n 1)
          fi
          cp "$UNIVERSAL_APK" "ViMusic-v0.5.5.apk"

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v0.5.5 "ViMusic-v0.5.5.apk" --clobber

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViMusic-v0.5.5-apk
          path: ViMusic-v0.5.5.apk
